<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" style="min-width:500px" role="img" aria-labelledby="jeeves-overview-title jeeves-overview-desc" font-family="'Fira Sans', system-ui, sans-serif">
  <title id="jeeves-overview-title">The review viewer's overview page</title>
  <desc id="jeeves-overview-desc">A browser shows _Overview.html for an invented work folder. Under the path &quot;01 PROJECTS / Wound Imaging App / resources / Review&quot;, the title reads &quot;Wound Imaging App – Product strategy&quot;, followed by the line &quot;3 items and 1 comment waiting. Built on 31 Oct 2026, 23:37.&quot; A Display button sits on the right. Three documents follow, a Briefing, a Memo and a Report. Each has an icon for its kind, its title, a one-line summary, the status Draft, the version V1, the date it was created and the date it was last edited. The Briefing also carries a yellow &quot;1 comment waiting&quot; label.</desc>

  <!-- Browser window: the viewer is a page opened from the work folder. -->
  <rect width="500" height="350" fill="#f8f8f7"/>
  <rect x="6" y="6" width="488" height="338" rx="8" fill="#f1efec"/>
  <path d="M 6 34 V 14 Q 6 6 14 6 H 486 Q 494 6 494 14 V 34 Z" fill="#efefed"/>
  <g fill="none" stroke="#8b8c8f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 20 H 16 M 19.5 16.5 L 16 20 L 19.5 23.5"/>
    <path d="M 34 20 H 42 M 38.5 16.5 L 42 20 L 38.5 23.5"/>
  </g>
  <rect x="56" y="12" width="388" height="16" rx="8" fill="#ffffff"/>
  <text x="68" y="23.5" font-size="8.5" fill="#626366">_Overview.html</text>
  <line x1="6" y1="34.5" x2="494" y2="34.5" stroke="#dbdbd7"/>

  <!-- Header: the folder's path, its title from the subject and context, the count line and the Display button. -->
  <text x="64" y="56" font-size="7" fill="#5a6879">01 PROJECTS / Wound Imaging App / resources / Review</text>
  <text x="64" y="78" font-size="15" font-weight="700" fill="#132030">Wound Imaging App – Product strategy</text>
  <text x="64" y="92" font-size="7.5" fill="#5a6879">3 items and 1 comment waiting. Built on 31 Oct 2026, 23:37.</text>
