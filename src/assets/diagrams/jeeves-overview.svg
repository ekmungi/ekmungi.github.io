  <svg x="399" y="49.5" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#132030" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
