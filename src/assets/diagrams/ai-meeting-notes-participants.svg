<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" style="min-width:500px" role="img" aria-labelledby="amn-participants-title amn-participants-desc" font-family="'Fira Sans', system-ui, sans-serif">
  <title id="amn-participants-title">Choosing the participants</title>
  <desc id="amn-participants-desc">A drawing of the participants picker. Under the heading "Select participants" is a field reading "Search stakeholders...", then one row per note in the contacts folder, each with a toggle. Two of the four example people are switched on. Skip and OK buttons sit at the bottom right.</desc>

  <!-- Window: drawn from the plugin's code, with invented example names. -->
  <rect width="500" height="350" fill="#f8f8f7"/>
  <rect x="6" y="6" width="488" height="338" rx="8" fill="#ffffff"/>
  <path d="M 6 34 V 14 Q 6 6 14 6 H 486 Q 494 6 494 14 V 34 Z" fill="#efefed"/>
  <text x="18" y="24" font-size="11" fill="#626366">Obsidian</text>
  <g stroke="#8b8c8f" stroke-width="1.2" fill="none">
    <path d="M 438 20 H 446"/>
    <rect x="456" y="16" width="8" height="8"/>
    <path d="M 474 16 L 482 24 M 482 16 L 474 24"/>
  </g>

  <!-- The note underneath, faded behind the picker. -->
  <path d="M 6 35 H 30 V 344 H 14 Q 6 344 6 336 Z" fill="#f6f6f6"/>
  <g fill="#ececeb">
    <rect x="48" y="56" width="180" height="10" rx="3"/>
    <rect x="48" y="80" width="400" height="7" rx="3"/>
    <rect x="48" y="96" width="360" height="7" rx="3"/>
    <rect x="48" y="112" width="380" height="7" rx="3"/>
  </g>
  <path d="M 6 35 H 494 V 336 Q 494 344 486 344 H 14 Q 6 344 6 336 Z" fill="#2b2c2e" fill-opacity="0.08"/>
  <line x1="6" y1="34.5" x2="494" y2="34.5" stroke="#dbdbd7"/>

  <!-- The participants picker. -->
  <rect x="80" y="56" width="340" height="270" rx="8" fill="#ffffff" stroke="#c4c5c1"/>
  <text x="100" y="86" font-size="15" font-weight="600" fill="#2b2c2e">Select participants</text>
  <rect x="100" y="100" width="300" height="26" rx="4" fill="#ffffff" stroke="#c4c5c1"/>
  <text x="108" y="117" font-size="12" fill="#a3a4a6">Search stakeholders...</text>

  <g font-size="12" fill="#2b2c2e">
    <text x="108" y="156">Alex Rivera</text>
    <text x="108" y="186">Jordan Kim</text>
    <text x="108" y="216">Priya Nair</text>
    <text x="108" y="246">Sam Lee</text>
  </g>
  <!-- Toggles: on in the accent, off in grey. -->
  <rect x="364" y="143" width="30" height="17" rx="8.5" fill="#4a5f86"/>
  <circle cx="385.5" cy="151.5" r="6.5" fill="#ffffff"/>
  <rect x="364" y="173" width="30" height="17" rx="8.5" fill="#d6d6d3"/>
  <circle cx="372.5" cy="181.5" r="6.5" fill="#ffffff"/>
  <rect x="364" y="203" width="30" height="17" rx="8.5" fill="#4a5f86"/>
  <circle cx="385.5" cy="211.5" r="6.5" fill="#ffffff"/>
  <rect x="364" y="233" width="30" height="17" rx="8.5" fill="#d6d6d3"/>
  <circle cx="372.5" cy="241.5" r="6.5" fill="#ffffff"/>

  <rect x="276" y="282" width="56" height="28" rx="4" fill="#f6f6f6" stroke="#c4c5c1"/>
  <text x="304" y="300" font-size="12" fill="#2b2c2e" text-anchor="middle">Skip</text>
  <rect x="340" y="282" width="60" height="28" rx="4" fill="#4a5f86"/>
  <text x="370" y="300" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">OK</text>

  <!-- Window outline last, so the border stays crisp over the fills. -->
  <rect x="6" y="6" width="488" height="338" rx="8" fill="none" stroke="#c4c5c1"/>
</svg>
