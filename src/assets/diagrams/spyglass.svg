<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" style="min-width:960px" role="img" aria-labelledby="spyglass-title spyglass-desc" font-family="'Fira Sans', system-ui, sans-serif">
  <title id="spyglass-title">How Spyglass works</title>
  <desc id="spyglass-desc">Spyglass collects new items from feeds and bookmarks on the web into a local library. A language model reached through OpenRouter scores each item from its title and description, and for the relevant ones writes the summary and tags. It also suggests categories and writes the daily brief. In the automatic pass only relevant items go through the fetch ladder, which reads the article pages from the web, one of its steps through a hosted reader. Local vectors find similar items and carry the thumbs vote. Claude reaches the library through a linked MCP session and through locked-down background runs, and writes detailed notes into the vault.</desc>
  <defs>
    <marker id="spyglass-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#8b8c8f"/>
    </marker>
    <marker id="spyglass-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5f86"/>
    </marker>
  </defs>

  <!-- Paper: the frame colour, so label masks match what sits behind them. -->
  <rect width="960" height="420" fill="#f8f8f7"/>

  <!-- Zones: the web, my computer, and the hosted models. -->
  <rect x="16" y="16" width="208" height="388" rx="8" fill="#3a3b3d" fill-opacity="0.02" stroke="#dbdbd7" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="32" y="38" fill="#626366" font-size="11" font-weight="500" letter-spacing="0.12em">THE WEB</text>
  <rect x="240" y="16" width="480" height="388" rx="8" fill="#3a3b3d" fill-opacity="0.02" stroke="#dbdbd7" stroke-width="1"/>
  <text x="256" y="38" fill="#626366" font-size="11" font-weight="500" letter-spacing="0.12em">ON MY COMPUTER</text>
  <rect x="736" y="16" width="208" height="388" rx="8" fill="#3a3b3d" fill-opacity="0.02" stroke="#dbdbd7" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="752" y="38" fill="#626366" font-size="11" font-weight="500" letter-spacing="0.12em">HOSTED MODELS</text>

  <!-- Connectors, drawn before the boxes. -->
  <g fill="none" stroke="#8b8c8f" stroke-width="1.2">
    <path d="M 208 92 H 271" marker-end="url(#spyglass-arrow)"/>
    <path d="M 361 129 V 311" marker-start="url(#spyglass-arrow)" marker-end="url(#spyglass-arrow)"/>
    <path d="M 209 348 H 271" marker-start="url(#spyglass-arrow)" marker-end="url(#spyglass-arrow)"/>
    <path d="M 420 129 V 212 Q 420 220 428 220 H 511" marker-start="url(#spyglass-arrow)" marker-end="url(#spyglass-arrow)"/>
    <path d="M 449 120 H 696 Q 704 120 704 128 V 322 Q 704 330 712 330 H 751" marker-start="url(#spyglass-arrow)" marker-end="url(#spyglass-arrow)"/>
    <path d="M 752 362 H 689" marker-end="url(#spyglass-arrow)"/>
  </g>
  <!-- The relevance gate carries the accent: every item is judged before anything expensive happens. -->
  <path d="M 449 84 H 751" fill="none" stroke="#4a5f86" stroke-width="1.4" marker-start="url(#spyglass-arrow-accent)" marker-end="url(#spyglass-arrow-accent)"/>

  <!-- Connector labels on masks, with a gap to their line. -->
  <g font-size="11" font-weight="500" letter-spacing="0.06em" fill="#626366">
    <rect x="218" y="60" width="44" height="16" rx="2" fill="#f8f8f7"/>
    <text x="240" y="72" text-anchor="middle">ITEMS</text>
    <rect x="546" y="60" width="104" height="16" rx="2" fill="#f8f8f7"/>
    <text x="598" y="72" text-anchor="middle" fill="#4a5f86">SCORE, SUMMARY</text>
    <rect x="566" y="96" width="64" height="16" rx="2" fill="#f8f8f7"/>
    <text x="598" y="108" text-anchor="middle">MCP LINK</text>
    <rect x="268" y="212" width="84" height="16" rx="2" fill="#f8f8f7"/>
    <text x="272" y="224">IF RELEVANT</text>
    <rect x="440" y="196" width="64" height="16" rx="2" fill="#f8f8f7"/>
    <text x="472" y="208" text-anchor="middle">VECTORS</text>
    <rect x="218" y="324" width="44" height="16" rx="2" fill="#f8f8f7"/>
    <text x="240" y="336" text-anchor="middle">FETCH</text>
    <rect x="698" y="370" width="48" height="16" rx="2" fill="#f8f8f7"/>
    <text x="722" y="382" text-anchor="middle">NOTES</text>
  </g>

  <!-- Boxes: opaque fills, so the lines drawn before them stop at their edges. -->
  <g stroke-width="1">
    <rect x="32" y="56" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="32" y="312" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="272" y="56" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="272" y="312" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="512" y="184" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="512" y="312" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="752" y="56" width="176" height="72" rx="6" fill="#eef1f6" stroke="#4a5f86" stroke-width="1.4"/>
    <rect x="752" y="312" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
  </g>

  <!-- Names and sublabels. -->
  <g text-anchor="middle">
    <g font-size="15" font-weight="600" fill="#2b2c2e">
      <text x="120" y="86">Feeds and bookmarks</text>
      <text x="120" y="342">Article pages</text>
      <text x="360" y="86">Library</text>
      <text x="360" y="336">Fetch ladder</text>
      <text x="600" y="208">Local vectors</text>
      <text x="600" y="342">Vault notes</text>
      <text x="840" y="80" fill="#4a5f86">Language model</text>
      <text x="840" y="336">Claude</text>
    </g>
    <g font-size="12" fill="#626366">
      <text x="120" y="106">RSS, Atom, Raindrop</text>
      <text x="120" y="362">full text and PDFs</text>
      <text x="360" y="106">SQLite, full-text search</text>
      <text x="360" y="356">four steps, one of them hosted;</text>
      <text x="360" y="372">the working one kept per site</text>
      <text x="600" y="228">similar items and</text>
      <text x="600" y="244">the thumbs vote</text>
      <text x="600" y="362">detailed notes, filed</text>
      <text x="840" y="100" font-size="11">via OpenRouter: relevance gate,</text>
      <text x="840" y="116" font-size="11">summaries, categories, brief</text>
      <text x="840" y="356">linked session and</text>
      <text x="840" y="372">locked-down runs</text>
    </g>
  </g>
</svg>
