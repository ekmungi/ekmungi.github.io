<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" style="min-width:500px" role="img" aria-labelledby="jeeves-comment-title jeeves-comment-desc" font-family="'Fira Sans', system-ui, sans-serif">
  <title id="jeeves-comment-title">A document in the reading view, with a comment answered by Claude</title>
  <desc id="jeeves-comment-desc">The invented briefing &quot;Regulatory Pathway Options&quot; is open in the reading view of a narrow window. A top bar holds &quot;Back to all items&quot;, the Display button and the briefing's title. In the document, the Options section has one passage highlighted: &quot;A De Novo request needs no predicate but asks for more evidence and takes longer to review.&quot; The comments panel lies over the right of the page and says &quot;Saving to this folder&quot;. Its one thread, marked Answered, quotes the passage and asks: &quot;How much longer is the De Novo review in practice? Give me a range I can plan with.&quot; Below the question are icons to edit, delete and resolve the comment. Claude's reply says that a De Novo review usually takes longer than a 510(k) and asks whether to add both review goals to the Options section, with their source. A link reads &quot;Add a follow-up&quot;.</desc>

  <!-- Browser window: the viewer is a page opened from the work folder. -->
  <rect width="500" height="350" fill="#f8f8f7"/>
  <rect x="6" y="6" width="488" height="338" rx="8" fill="#f1efec"/>
  <path d="M 6 34 V 14 Q 6 6 14 6 H 486 Q 494 6 494 14 V 34 Z" fill="#efefed"/>
  <g fill="none" stroke="#8b8c8f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 20 H 16 M 19.5 16.5 L 16 20 L 19.5 23.5"/>
    <path d="M 34 20 H 42 M 38.5 16.5 L 42 20 L 38.5 23.5"/>
  </g>
  <rect x="56" y="12" width="388" height="16" rx="8" fill="#ffffff"/>
  <text x="68" y="23.5" font-size="8.5" fill="#626366">_Overview.html#/doc/20261031-regulatory-pathway-options-v1</text>
  <line x1="6" y1="34.5" x2="494" y2="34.5" stroke="#dbdbd7"/>

  <!-- The top bar of the narrow layout: back, Display, and the folder's items with the open one marked. -->
  <text x="18" y="50" font-size="7.5" fill="#132030">Back to all items</text>
  <rect x="84" y="40" width="18" height="15" rx="4" fill="#ffffff" stroke="#e1ddd6"/>
  <svg x="88" y="42.5" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#132030" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  <rect x="108" y="40" width="190" height="15" rx="4" fill="#fcefd8"/>
  <text x="115" y="50.3" font-size="7.5" fill="#8c5200">Wound Imaging App – Product strategy – Briefing</text>

  <!-- The document card, which runs on under the comments panel and below the view. -->
  <clipPath id="jeeves-comment-page"><rect x="6" y="60" width="488" height="284"/></clipPath>
  <g clip-path="url(#jeeves-comment-page)">
  <rect x="16" y="64" width="470" height="300" rx="10" fill="#ffffff"/>
  <rect x="30" y="75" width="21" height="10" rx="5" fill="#ece8e2"/>
  <text x="40.5" y="82" font-size="6" font-weight="500" fill="#5a6879" text-anchor="middle">Draft</text>
  <text x="57" y="82" font-size="6" fill="#5a6879">V1</text>
  <svg x="70" y="75" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#5a6879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg>
  <text x="80" y="82" font-size="6" fill="#5a6879">31 Oct 2026</text>
  <svg x="122" y="75" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#5a6879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l1.2-4.4 9.6-9.6a2 2 0 012.8 0l.4.4a2 2 0 010 2.8L9.4 17.8z"/><path d="M14 7l3 3"/></svg>
  <text x="132" y="82" font-size="6" fill="#5a6879">31 Oct 2026, 23:34</text>
  <text x="30" y="94" font-size="6" fill="#5a6879">01 PROJECTS / Wound Imaging App / resources / Review /</text>
  <text x="30" y="102" font-size="6" fill="#5a6879">20261031_Regulatory_Pathway_Options_V1.html</text>
  <line x1="30" y1="108.5" x2="472" y2="108.5" stroke="#e1ddd6"/>
  <text x="30" y="121" font-size="6.5" font-weight="600" fill="#8c5200">Briefing</text>
  <text x="30" y="136" font-size="12.5" font-weight="700" fill="#132030">Regulatory Pathway Options</text>
  <text x="30" y="148.0" font-size="7" fill="#5a6879">Compares a De Novo request with a 510(k) for the wound-</text>
  <text x="30" y="157.5" font-size="7" fill="#5a6879">measurement feature.</text>
  <text x="30" y="176" font-size="8.5" font-weight="700" fill="#132030"><tspan fill="#b56a00">1</tspan>  Summary</text>
  <rect x="30" y="182" width="442" height="27" fill="#fcefd8"/>
  <rect x="30" y="182" width="2" height="27" fill="#b56a00"/>
  <text x="37" y="193" font-size="7" fill="#2a3747"><tspan font-weight="700" fill="#132030">Key point:</tspan> A 510(k) is the faster route if a cleared wound-</text>
  <text x="37" y="203" font-size="7" fill="#2a3747">measurement device can serve as the predicate.</text>
  <text x="30" y="228" font-size="8.5" font-weight="700" fill="#132030"><tspan fill="#b56a00">2</tspan>  Options</text>
  <!-- The commented passage carries the viewer's highlight: a wide stroke painted under the glyphs. -->
  <text x="30" y="243" font-size="7" fill="#2a3747">A 510(k) needs a predicate with the same intended use and a</text>
  <text x="30" y="253.5" font-size="7" fill="#2a3747">performance test against it. <tspan stroke="#fbe7a1" stroke-width="8" stroke-linejoin="round" paint-order="stroke">A De Novo request needs no</tspan></text>
  <text x="30" y="264" font-size="7" fill="#2a3747"><tspan stroke="#fbe7a1" stroke-width="8" stroke-linejoin="round" paint-order="stroke">predicate but asks for more evidence and takes longer to review.</tspan></text>
  <text x="30" y="290" font-size="8.5" font-weight="700" fill="#132030"><tspan fill="#b56a00">3</tspan>  Next step</text>
  <text x="30" y="305.0" font-size="7" fill="#2a3747">Ask the clinical team which measurement error clinicians</text>
  <text x="30" y="315.5" font-size="7" fill="#2a3747">accept, because that number sets the performance goal in</text>
  <text x="30" y="326.0" font-size="7" fill="#2a3747">either route.</text>
  </g>

  <!-- The comments panel, open over the right of the reading view. -->
  <path d="M 300 35 H 494 V 336 Q 494 344 486 344 H 300 Z" fill="#ffffff"/>
  <line x1="300.5" y1="35" x2="300.5" y2="344" stroke="#e1ddd6"/>
  <text x="310" y="53" font-size="9.5" font-weight="700" fill="#132030">Comments</text>
  <svg x="457" y="43" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#5a6879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 14v6"/></svg>
  <svg x="475" y="43" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#5a6879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  <rect x="310" y="61" width="80" height="11" rx="5.5" fill="#e1f2e6"/>
  <text x="350" y="68.8" font-size="6.5" fill="#1e5b32" text-anchor="middle">Saving to this folder</text>
  <text x="310" y="86" font-size="6.8" fill="#5a6879">Select text in the document, then choose Comment.</text>

  <!-- One thread: the comment, its tools, Claude's reply and the follow-up link. -->
  <rect x="308" y="94" width="178" height="168" rx="8" fill="#ffffff" stroke="#e1ddd6"/>
  <text x="316" y="108" font-size="7" fill="#5a6879"><tspan font-weight="700" fill="#132030">You</tspan>  31 Oct, 22:40</text>
  <rect x="440" y="100.5" width="38" height="10.5" rx="5.25" fill="#fcefd8"/>
  <text x="459" y="108" font-size="6.2" font-weight="600" fill="#8c5200" text-anchor="middle">Answered</text>
  <rect x="316" y="114" width="2.5" height="21" fill="#fbe7a1"/>
  <text x="323" y="122" font-size="6.3" fill="#5a6879" font-style="italic">A De Novo request needs no predicate but asks</text>
  <text x="323" y="131" font-size="6.3" fill="#5a6879" font-style="italic">for more evidence and takes longer to review.</text>
  <text x="316" y="149" font-size="7.3" fill="#2a3747">How much longer is the De Novo review in</text>
  <text x="316" y="159" font-size="7.3" fill="#2a3747">practice? Give me a range I can plan with.</text>
  <rect x="316" y="164" width="14" height="14" rx="4" fill="#ffffff" stroke="#e1ddd6"/>
  <svg x="318.5" y="166.5" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#5a6879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19l1-4L16 5l3 3L9 18z"/><path d="M14 7l3 3"/></svg>
  <rect x="334" y="164" width="14" height="14" rx="4" fill="#ffffff" stroke="#e1ddd6"/>
  <svg x="336.5" y="166.5" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#5a6879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l1 12.5h9l1-12.5"/><path d="M10.5 11v5M13.5 11v5"/></svg>
  <rect x="352" y="164" width="14" height="14" rx="4" fill="#ffffff" stroke="#e1ddd6"/>
  <svg x="354.5" y="166.5" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#5a6879" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>
  <rect x="316" y="186" width="162" height="50" rx="6" fill="#f6f4f1"/>
  <text x="324" y="198" font-size="7" fill="#5a6879"><tspan font-weight="700" fill="#132030">Claude</tspan>  31 Oct, 23:37</text>
  <text x="324" y="211" font-size="7.3" fill="#2a3747">A De Novo review usually takes longer than</text>
  <text x="324" y="221" font-size="7.3" fill="#2a3747">a 510(k). Should I add both review goals to</text>
  <text x="324" y="231" font-size="7.3" fill="#2a3747">the Options section, with their source?</text>
  <text x="316" y="252" font-size="6.8" fill="#8c5200" text-decoration="underline">Add a follow-up</text>
</svg>
