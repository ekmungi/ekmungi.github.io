<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" style="min-width:500px" role="img" aria-labelledby="ytt-note-title ytt-note-desc" font-family="'Fira Sans', system-ui, sans-serif">
  <title id="ytt-note-title">A saved transcript note</title>
  <desc id="ytt-note-desc">A drawing of a transcript note for an invented lecture, "An Introduction to Signal Processing", in a file named after the title and the video ID. Its properties list the title, channel, address, video ID, date, duration, caption source, caption language and the tags youtube and transcript. Below the heading the transcript runs as paragraphs, then, after more paragraphs, a [05:00] marker at the five-minute mark.</desc>

  <!-- Window: drawn from the engine's note format, with an invented example video. -->
  <rect width="500" height="350" fill="#f8f8f7"/>
  <rect x="6" y="6" width="488" height="338" rx="8" fill="#ffffff"/>
  <path d="M 6 34 V 14 Q 6 6 14 6 H 486 Q 494 6 494 14 V 34 Z" fill="#efefed"/>
  <text x="18" y="24" font-size="11" fill="#626366">An Introduction to Signal Processing [aB3dE5fG7hI]</text>
  <g stroke="#8b8c8f" stroke-width="1.2" fill="none">
    <path d="M 438 20 H 446"/>
    <rect x="456" y="16" width="8" height="8"/>
    <path d="M 474 16 L 482 24 M 482 16 L 474 24"/>
  </g>
  <line x1="6" y1="34.5" x2="494" y2="34.5" stroke="#dbdbd7"/>
  <path d="M 6 35 H 30 V 344 H 14 Q 6 344 6 336 Z" fill="#f6f6f6"/>
  <line x1="30.5" y1="35" x2="30.5" y2="344" stroke="#dbdbd7"/>

  <!-- Properties: the frontmatter the engine writes. -->
  <text x="48" y="56" font-size="10" font-weight="600" fill="#a3a4a6">Properties</text>
  <g font-size="10">
    <g fill="#626366">
      <text x="52" y="73">title</text>
      <text x="52" y="88">channel</text>
      <text x="52" y="103">url</text>
      <text x="52" y="118">video_id</text>
      <text x="52" y="133">date</text>
      <text x="52" y="148">duration</text>
      <text x="52" y="163">source</text>
      <text x="52" y="178">caption_language</text>
      <text x="52" y="194">tags</text>
    </g>
    <g fill="#2b2c2e">
      <text x="150" y="73">An Introduction to Signal Processing</text>
      <text x="150" y="88">Open Lecture Series</text>
      <text x="150" y="103" fill="#4a5f86">https://www.youtube.com/watch?v=aB3dE5fG7hI</text>
      <text x="150" y="118">aB3dE5fG7hI</text>
      <text x="150" y="133">2026-10-30</text>
      <text x="150" y="148">48:12</text>
      <text x="150" y="163">manual_captions</text>
      <text x="150" y="178">en</text>
    </g>
    <rect x="148" y="184" width="50" height="14" rx="7" fill="#efefed"/>
    <text x="173" y="194.5" text-anchor="middle" fill="#2b2c2e">youtube</text>
    <rect x="204" y="184" width="62" height="14" rx="7" fill="#efefed"/>
    <text x="235" y="194.5" text-anchor="middle" fill="#2b2c2e">transcript</text>
  </g>
  <line x1="48" y1="206.5" x2="478" y2="206.5" stroke="#ececeb"/>

  <!-- The transcript: caption fragments joined into paragraphs, a marker every five minutes. -->
  <text x="48" y="230" font-size="16" font-weight="600" fill="#2b2c2e">An Introduction to Signal Processing</text>
  <g font-size="10.5" fill="#2b2c2e">
    <text x="48" y="252">Welcome to the first lecture. Today we look at what a signal is, how we</text>
    <text x="48" y="266">sample it, and why the sampling rate decides which frequencies we can</text>
    <text x="48" y="280">still recover afterwards.</text>
    <text x="48" y="298" fill="#a3a4a6">…</text>
    <text x="48" y="318" fill="#626366">[05:00]</text>
    <text x="48" y="338">So if we sample too slowly, the high frequencies fold back into the low…</text>
  </g>

  <!-- Window outline last, so the border stays crisp over the fills. -->
  <rect x="6" y="6" width="488" height="338" rx="8" fill="none" stroke="#c4c5c1"/>
</svg>
