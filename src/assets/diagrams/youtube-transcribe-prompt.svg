<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" style="min-width:500px" role="img" aria-labelledby="ytt-prompt-title ytt-prompt-desc" font-family="'Fira Sans', system-ui, sans-serif">
  <title id="ytt-prompt-title">The transcribe prompt</title>
  <desc id="ytt-prompt-desc">A drawing of the dialog titled "Transcribe YouTube video". A field labelled "YouTube URL", described as "Paste a youtube.com/watch or youtu.be link.", already holds a link taken from the clipboard, and a Transcribe button sits below it.</desc>

  <!-- Window: drawn from the plugin's code, with an invented example link. -->
  <rect width="500" height="350" fill="#f8f8f7"/>
  <rect x="6" y="6" width="488" height="338" rx="8" fill="#ffffff"/>
  <path d="M 6 34 V 14 Q 6 6 14 6 H 486 Q 494 6 494 14 V 34 Z" fill="#efefed"/>
  <text x="18" y="24" font-size="11" fill="#626366">Obsidian</text>
  <g stroke="#8b8c8f" stroke-width="1.2" fill="none">
    <path d="M 438 20 H 446"/>
    <rect x="456" y="16" width="8" height="8"/>
    <path d="M 474 16 L 482 24 M 482 16 L 474 24"/>
  </g>

  <!-- The note underneath, faded behind the dialog. -->
  <path d="M 6 35 H 30 V 344 H 14 Q 6 344 6 336 Z" fill="#f6f6f6"/>
  <g fill="#ececeb">
    <rect x="48" y="56" width="180" height="10" rx="3"/>
    <rect x="48" y="80" width="400" height="7" rx="3"/>
    <rect x="48" y="96" width="360" height="7" rx="3"/>
    <rect x="48" y="112" width="380" height="7" rx="3"/>
    <rect x="48" y="136" width="300" height="7" rx="3"/>
  </g>
  <path d="M 6 35 H 494 V 336 Q 494 344 486 344 H 14 Q 6 344 6 336 Z" fill="#2b2c2e" fill-opacity="0.08"/>
  <line x1="6" y1="34.5" x2="494" y2="34.5" stroke="#dbdbd7"/>

  <!-- The dialog. -->
  <rect x="50" y="84" width="400" height="186" rx="8" fill="#ffffff" stroke="#c4c5c1"/>
  <text x="72" y="118" font-size="16" font-weight="600" fill="#2b2c2e">Transcribe YouTube video</text>
  <line x1="72" y1="134.5" x2="428" y2="134.5" stroke="#ececeb"/>
  <text x="72" y="158" font-size="12" font-weight="500" fill="#2b2c2e">YouTube URL</text>
  <text x="72" y="173" font-size="10" fill="#626366">Paste a youtube.com/watch or</text>
  <text x="72" y="186" font-size="10" fill="#626366">youtu.be link.</text>
  <rect x="242" y="152" width="186" height="26" rx="4" fill="#ffffff" stroke="#4a5f86" stroke-width="1.2"/>
  <text x="250" y="169" font-size="11" fill="#2b2c2e">https://youtu.be/aB3dE5fG7hI</text>
  <line x1="72" y1="204.5" x2="428" y2="204.5" stroke="#ececeb"/>
  <rect x="340" y="220" width="88" height="30" rx="4" fill="#4a5f86"/>
  <text x="384" y="239" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Transcribe</text>

  <!-- Window outline last, so the border stays crisp over the fills. -->
  <rect x="6" y="6" width="488" height="338" rx="8" fill="none" stroke="#c4c5c1"/>
</svg>
