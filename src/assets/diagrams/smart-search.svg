<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" style="min-width:960px" role="img" aria-labelledby="smart-search-title smart-search-desc" font-family="'Fira Sans', system-ui, sans-serif">
  <title id="smart-search-title">How Smart Search works</title>
  <desc id="smart-search-desc">Smart Search reads and splits the files in your folders into a keyword index and, after embedding them, a vector store; a query from Claude Code, the desktop app, REST or the command line searches both stores by words and by meaning, fuses and reranks the matches, and returns each passage with the file it came from.</desc>
  <defs>
    <marker id="smart-search-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b8c8f"/>
    </marker>
  </defs>

  <!-- Paper: the frame colour, so label masks match what sits behind them. -->
  <rect width="960" height="488" fill="#f8f8f7"/>

  <!-- Zones: indexing above, search below. -->
  <rect x="16" y="16" width="928" height="264" rx="8" fill="#3a3b3d" fill-opacity="0.02" stroke="#dbdbd7" stroke-width="1"/>
  <text x="32" y="38" fill="#626366" font-size="11" font-weight="500" letter-spacing="0.12em">INDEXING</text>
  <rect x="16" y="312" width="928" height="160" rx="8" fill="#3a3b3d" fill-opacity="0.02" stroke="#dbdbd7" stroke-width="1"/>
  <text x="32" y="334" fill="#626366" font-size="11" font-weight="500" letter-spacing="0.12em">SEARCH</text>

  <!-- Connectors, drawn before the boxes. -->
  <g fill="none" stroke="#8b8c8f" stroke-width="1.2">
    <path d="M 208 92 H 271" marker-end="url(#smart-search-arrow)"/>
    <path d="M 448 92 H 511" marker-end="url(#smart-search-arrow)"/>
    <path d="M 360 128 V 183" marker-end="url(#smart-search-arrow)"/>
    <path d="M 600 128 V 183" marker-end="url(#smart-search-arrow)"/>
    <path d="M 360 256 V 351" marker-end="url(#smart-search-arrow)"/>
    <path d="M 600 256 V 351" marker-end="url(#smart-search-arrow)"/>
    <path d="M 208 388 H 271" marker-end="url(#smart-search-arrow)"/>
    <path d="M 688 388 H 751" marker-end="url(#smart-search-arrow)"/>
    <path d="M 840 424 V 440 Q 840 448 832 448 H 128 Q 120 448 120 440 V 425" stroke-dasharray="5,4" marker-end="url(#smart-search-arrow)"/>
  </g>

  <!-- Connector labels on masks, with a gap to their line. -->
  <g font-size="11" font-weight="500" letter-spacing="0.06em" fill="#626366">
    <rect x="454" y="68" width="52" height="16" rx="2" fill="#f8f8f7"/>
    <text x="480" y="80" text-anchor="middle">CHUNKS</text>
    <rect x="368" y="288" width="64" height="16" rx="2" fill="#f8f8f7"/>
    <text x="372" y="300">BY WORDS</text>
    <rect x="608" y="288" width="80" height="16" rx="2" fill="#f8f8f7"/>
    <text x="612" y="300">BY MEANING</text>
    <rect x="218" y="364" width="44" height="16" rx="2" fill="#f8f8f7"/>
    <text x="240" y="376" text-anchor="middle">QUERY</text>
    <rect x="694" y="364" width="52" height="16" rx="2" fill="#f8f8f7"/>
    <text x="720" y="376" text-anchor="middle">RANKED</text>
  </g>

  <!-- Boxes: opaque fills, so the lines drawn before them stop at their edges. The accent marks the one focal box. -->
  <g stroke-width="1">
    <rect x="32" y="56" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="272" y="56" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="512" y="56" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="272" y="184" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="512" y="184" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="32" y="352" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
    <rect x="272" y="352" width="416" height="72" rx="6" fill="#eef1f6" stroke="#4a5f86" stroke-width="1.4"/>
    <rect x="752" y="352" width="176" height="72" rx="6" fill="#ffffff" stroke="#c4c5c1"/>
  </g>

  <!-- Names and sublabels. -->
  <g text-anchor="middle">
    <g font-size="15" font-weight="600" fill="#2b2c2e">
      <text x="120" y="86">Folders</text>
      <text x="360" y="86">Read and split</text>
      <text x="600" y="86">Embed</text>
      <text x="360" y="214">Keyword index</text>
      <text x="600" y="214">Vector store</text>
      <text x="120" y="380">Tools</text>
      <text x="480" y="382" fill="#4a5f86">Hybrid search</text>
      <text x="840" y="382">Results</text>
    </g>
    <g font-size="12" fill="#626366">
      <text x="120" y="106">notes, PDFs, Word, slides</text>
      <text x="360" y="106">by heading, ≤ 200 words</text>
      <text x="600" y="106">Arctic Embed, runs locally</text>
      <text x="360" y="234">SQLite full-text search</text>
      <text x="600" y="234">LanceDB</text>
      <text x="120" y="398">Claude Code via MCP</text>
      <text x="120" y="414">desktop app, REST, CLI</text>
      <text x="480" y="402">meaning and keywords, fused, then reranked</text>
      <text x="840" y="402">passage and source file</text>
    </g>
  </g>
</svg>
