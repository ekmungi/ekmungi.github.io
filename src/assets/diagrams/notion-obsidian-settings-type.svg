<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" style="min-width:500px" role="img" aria-labelledby="no-set-type-title no-set-type-desc" font-family="'Fira Sans', system-ui, sans-serif">
  <title id="no-set-type-title">Style Settings: fonts and sizes</title>
  <desc id="no-set-type-desc">A drawing of the rest of the theme&#x27;s Style Settings panel: the body font set to Fira Sans, sliders for the interface font size and the Settings window font size, and the heading sizes H1 to H4 at 1.8, 1.4, 1.3 and 1.2, with H5, H6, the body paragraph, the table sizes and the colours further down.</desc>

  <!-- Obsidian's Settings dialog showing the Style Settings panel; the names and descriptions are the theme's own. -->
  <rect width="500" height="350" fill="#f8f8f7"/>
  <rect x="6" y="6" width="488" height="338" rx="8" fill="#ffffff"/>
  <path d="M 6 34 V 14 Q 6 6 14 6 H 486 Q 494 6 494 14 V 34 Z" fill="#efefed"/>
  <text x="18" y="24" font-size="11" fill="#626366">Settings · Style Settings</text>
  <path d="M 474 16 L 482 24 M 482 16 L 474 24" stroke="#8b8c8f" stroke-width="1.2" fill="none"/>
  <line x1="6" y1="34.5" x2="494" y2="34.5" stroke="#dbdbd7"/>
  <path d="M 18 49 L 22 53 L 26 49" fill="none" stroke="#626366" stroke-width="1.3"/>
  <text x="32" y="56" font-size="12" font-weight="600" fill="#2b2c2e">Font selection</text>
  <text x="32" y="78" font-size="10.5" font-weight="500" fill="#2b2c2e">Body font</text>
  <text x="32" y="90" font-size="8.5" fill="#626366">Choose the font for body text. All fonts are bundled with the theme.</text>
  <rect x="380" y="68" width="100" height="18" rx="3" fill="#ffffff" stroke="#c4c5c1"/><text x="388" y="80" font-size="10" fill="#2b2c2e">Fira Sans</text><path d="M 466 75 L 470 79 L 474 75" fill="none" stroke="#626366" stroke-width="1.2"/>
  <line x1="32" y1="96.5" x2="482" y2="96.5" stroke="#ececeb"/>
  <path d="M 18 109 L 22 113 L 26 109" fill="none" stroke="#626366" stroke-width="1.3"/>
  <text x="32" y="116" font-size="12" font-weight="600" fill="#2b2c2e">Interface font size</text>
  <text x="32" y="138" font-size="10.5" font-weight="500" fill="#2b2c2e">UI font size</text>
  <text x="32" y="150" font-size="8.5" fill="#626366">Controls the sidebar, tabs, menus and other interface elements…</text>
  <line x1="370" y1="136" x2="480" y2="136" stroke="#d6d6d3" stroke-width="3" stroke-linecap="round"/><line x1="370" y1="136" x2="392.9" y2="136" stroke="#4a5f86" stroke-width="3" stroke-linecap="round"/><circle cx="392.9" cy="136" r="6" fill="#ffffff" stroke="#c4c5c1"/>
  <line x1="32" y1="156.5" x2="482" y2="156.5" stroke="#ececeb"/>
  <text x="32" y="167" font-size="10.5" font-weight="500" fill="#2b2c2e">Settings window font size</text>
  <text x="32" y="179" font-size="8.5" fill="#626366">Controls the text in the Settings window, including plugin settings…</text>
  <line x1="370" y1="165" x2="480" y2="165" stroke="#d6d6d3" stroke-width="3" stroke-linecap="round"/><line x1="370" y1="165" x2="415.8" y2="165" stroke="#4a5f86" stroke-width="3" stroke-linecap="round"/><circle cx="415.8" cy="165" r="6" fill="#ffffff" stroke="#c4c5c1"/>
  <line x1="32" y1="185.5" x2="482" y2="185.5" stroke="#ececeb"/>
  <path d="M 18 198 L 22 202 L 26 198" fill="none" stroke="#626366" stroke-width="1.3"/>
  <text x="32" y="205" font-size="12" font-weight="600" fill="#2b2c2e">Headers typograph</text>
  <text x="32" y="227" font-size="10.5" font-weight="500" fill="#2b2c2e">H1</text>
  <text x="32" y="239" font-size="8.5" fill="#626366">Font size of H1</text>
  <rect x="432" y="217" width="48" height="18" rx="3" fill="#ffffff" stroke="#c4c5c1"/><text x="438" y="229" font-size="10" fill="#2b2c2e">1.8</text>
  <line x1="32" y1="245.5" x2="482" y2="245.5" stroke="#ececeb"/>
  <text x="32" y="252" font-size="10.5" font-weight="500" fill="#2b2c2e">H2</text>
  <text x="32" y="264" font-size="8.5" fill="#626366">Font size of H2</text>
  <rect x="432" y="242" width="48" height="18" rx="3" fill="#ffffff" stroke="#c4c5c1"/><text x="438" y="254" font-size="10" fill="#2b2c2e">1.4</text>
  <line x1="32" y1="270.5" x2="482" y2="270.5" stroke="#ececeb"/>
  <text x="32" y="277" font-size="10.5" font-weight="500" fill="#2b2c2e">H3</text>
  <text x="32" y="289" font-size="8.5" fill="#626366">Font size of H3</text>
  <rect x="432" y="267" width="48" height="18" rx="3" fill="#ffffff" stroke="#c4c5c1"/><text x="438" y="279" font-size="10" fill="#2b2c2e">1.3</text>
  <line x1="32" y1="295.5" x2="482" y2="295.5" stroke="#ececeb"/>
  <text x="32" y="302" font-size="10.5" font-weight="500" fill="#2b2c2e">H4</text>
  <text x="32" y="314" font-size="8.5" fill="#626366">Font size of H4</text>
  <rect x="432" y="292" width="48" height="18" rx="3" fill="#ffffff" stroke="#c4c5c1"/><text x="438" y="304" font-size="10" fill="#2b2c2e">1.2</text>
  <line x1="32" y1="320.5" x2="482" y2="320.5" stroke="#ececeb"/>
  <text x="32" y="329" font-size="9.5" fill="#a3a4a6">… H5, H6, body paragraph, table sizes and colours follow</text>
  <rect x="6" y="6" width="488" height="338" rx="8" fill="none" stroke="#c4c5c1"/>
</svg>
